name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify system.json version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SYSTEM_VERSION="$(jq -r .version system.json)"
          if [ "$SYSTEM_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::system.json version ($SYSTEM_VERSION) does not match tag ($GITHUB_REF_NAME)"
            exit 1
          fi

      - name: Build system.zip
        run: |
          mkdir -p build
          zip -r build/system.zip system.json template.json README.md LICENSE src templates css lang packs

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            build/system.zip
